name: Windows game DLL

on:
  push:
    branches:
      - main
      - director-scaffold
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      - name: Build release DLL
        shell: pwsh
        run: |
          msbuild rerelease\game.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:VcpkgTriplet=x64-windows-static

      - name: Upload game DLL
        uses: actions/upload-artifact@v4
        with:
          name: q2raid-game-x64
          path: |
            game_x64.dll
            game_x64.pdb
          if-no-files-found: error

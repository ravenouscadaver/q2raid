name: Windows game DLL

on:
  push:
    branches:
      - main
      - director-scaffold
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet x64-windows-static `
            --x-manifest-root="$env:GITHUB_WORKSPACE\rerelease" `
            --x-install-root="$env:GITHUB_WORKSPACE\vcpkg_installed"

      - name: Build release DLL
        shell: pwsh
        run: |
          msbuild rerelease\game.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:VcpkgEnableManifest=false `
            /p:VcpkgTriplet=x64-windows-static `
            /p:VcpkgInstalledDir="$env:GITHUB_WORKSPACE\vcpkg_installed\"

      - name: Upload game DLL and runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: q2raid-game-x64
          path: |
            game_x64.dll
            game_x64.pdb
            raid/ui/terminal_grunge/terminal_screen.png
            raid/ui/terminal_grunge/terminal_controls.png
          if-no-files-found: error

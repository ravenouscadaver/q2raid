# Q2Raid project-local Codex defaults.
# Loaded only when this repository is trusted.

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

# Q2Raid implementation authority remains canonical GitHub source, but the
# checked-out canonical repository working tree is the authorized implementation
# workspace. Allow in-place edits there; do not create parallel scratch copies.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Reduce environment-dependent behavior.
allow_login_shell = false

# AGENTS.md is the compact router. Detailed project Markdown is read deliberately
# instead of being injected through arbitrary fallback filenames.
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []
